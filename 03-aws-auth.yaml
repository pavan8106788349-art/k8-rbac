apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system

data:
  mapRoles: |
    - groups:
      - system:bootstrappers
      - system:nodes
      rolearn: arn:aws:iam::111122223333:role/my-role
      username: system:node:{{EC2PrivateDNSName}}

    - groups:
      - eks-console-dashboard-full-access-group
      rolearn: arn:aws:iam::111122223333:role/my-console-viewer-role
      username: my-console-viewer-role

  mapUsers: |
    - groups:
      - roboshop-trainee
      userarn: arn:aws:iam::353617811136:user/suresh
      username: suresh
    - groups:
      - roboshop-trainee
      userarn: arn:aws:iam::353617811136:user/John
      username: John
    - groups:
      - roboshop-trainee
      userarn: arn:aws:iam::353617811136:user/rahim
      username: rahim
    - groups:
      - roboshop-admin
      userarn: arn:aws:iam::353617811136:user/ramesh
      username: ramesh
